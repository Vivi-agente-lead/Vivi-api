services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vivi
      POSTGRES_PASSWORD: vivi
      POSTGRES_DB: vivi
    ports:
      - "5432:5432"
    volumes:
      - vivi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivi -d vivi"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_LOG_LEVEL: INFO
      POSTGRES_USER: vivi
      POSTGRES_PASSWORD: vivi
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: vivi
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: gpt-4o-mini
      OPENAI_TEMPERATURE: "0.3"
      LLM_CHECKPOINTER: postgres
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  vivi-db: