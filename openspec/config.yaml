schema: spec-driven

project: vivi-api

artifact_store: both

context: |
  Project: vivi-api — conversational agent that profiles real-estate leads for Colsubsidio (Colombia housing subsidy).
  Stack: Python 3.12. Dependency constraints as declared in pyproject.toml (NOT exact pins — see below):
         fastapi>=0.115, uvicorn[standard]>=0.32, sse-starlette>=2.1, langchain>=0.3, langgraph>=0.5,
         langgraph-checkpoint-postgres>=2.0, langchain-openai>=0.2, sqlalchemy[asyncio]>=2.0,
         psycopg[binary]>=3.2, pydantic>=2.9, pydantic-settings>=2.5, python-dotenv>=1.0.
         Dev: pytest>=8.3, pytest-asyncio>=0.24, httpx>=0.27.
  KNOWN GAP: these are open lower bounds, and `langgraph>=0.5` spans a major-version boundary.
         No lockfile exists and no .venv is committed, so the resolved versions are unverified.
         Exact pins + a committed lockfile are a prerequisite of the colsubsidio-lead-profiling
         change; record the resolved versions here once the lockfile exists. Do not assert an
         exact version in any artifact until then.
  Persistence: Postgres local (localhost:5432, db `vivi`). Schema via scripts/bootstrap_db.py
               (create_all, no DROP); destructive resets only via scripts/reset_db.py --yes.
               No Alembic this iteration; migrate once the lead schema stabilizes.
  Source of truth for domain data: docs/Preguntas y modelo tabla de datos.xlsx (field option lists,
               gating conditions, 44 proyectos, credit bands) and docs/Flujo asesor…json (node graph).
               Enumerated field values come from the workbook verbatim, normalized to canonical slugs.
  Channels: WhatsApp Cloud API implemented; HTTP/SSE web channel dropped this iteration (channel-agnostic FastAPI core).
  Tenancy: single-tenant.
  Run: uvicorn local (`.venv`), F5 in VSCode. A Dockerfile and docker-compose.yml exist and are used
       for the Fly.io demo image; local dev does not require them.
  Tests: pytest + pytest-asyncio (asyncio_mode=auto), httpx for ASGI tests. testpaths=["tests"] —
         all tests MUST live under tests/ or the configured test command will not run them.

strict_tdd: false   # hackathon (~20h); smoke tests + targeted tests on critical paths suffice

testing:
  runner: pytest
  command: pytest -q
  framework: pytest with asyncio_mode=auto
  testpaths: tests
  layers:
    unit: true
    integration: true   # httpx ASGI client for FastAPI endpoints
    e2e: false
  coverage:
    available: false
    command: ""
  quality:
    linter: false
    type_checker: false
    formatter: false

conventions:
  - Async-first (async def everywhere in app code paths)
  - No `print()` — use `logging.getLogger(__name__)`
  - Type hints required; prefer `from __future__ import annotations`
  - Pydantic v2 for schemas/settings
  - Channel-agnostic core; adapters per channel
  - Single-tenant assumptions; no multi-tenancy abstractions

rules:
  proposal:
    - Scope each change to a single iteration; include rollback notes for schema-affecting changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - A change is anchor-scoped to one channel when relevant (WhatsApp now; HTTP/SSE later)
  design:
    - Keep diagrams minimal; prefer sequence diagrams only for multi-actor flows (WhatsApp → API → LLM → Postgres)
    - Document non-obvious LangGraph node/state decisions with rationale
    - Never resolve a spec defect in design prose — amend the spec, because verify reads the spec
    - Enumerated field values MUST be quoted from docs/*.xlsx, never invented; cite the sheet and column
    - When the workbook and the flow diagram disagree, record the resolution as an explicit decision
  tasks:
    - Group by phase, hierarchical numbering
    - Each task completable in one session (~hackathon increment)
  apply:
    guidelines:
      - Follow existing app/ module patterns
      - Do not introduce Alembic this iteration
      - Pin exact dependency versions and commit a lockfile before writing graph code
      - Re-verify the LangGraph API against the installed package; do not trust doc-derived signatures
      - Place every test under tests/ so `pytest -q` actually runs it
    tdd: false
    test_command: "pytest -q"
  verify:
    test_command: "pytest -q"
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas into openspec/specs