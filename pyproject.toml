[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vivi-api"
version = "0.1.0"
description = "Backend for Vivi, a conversational agent that profiles real-estate leads."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vivi" }]
# Pins resolved against the committed `.venv` and recorded verbatim in
# `requirements.lock` (the reproducible lockfile — the source of truth for
# deployments). Lower bounds are intentionally dropped: `dependencies` here is
# an exact manifest so `pip install .` reproduces the locked graph. The lock
# supersedes any drift between this list and the full transitive set.
# See openspec/changes/colsubsidio-lead-profiling (Phase 0, task 0.1).
dependencies = [
    "fastapi==0.140.0",
    "uvicorn[standard]==0.51.0",
    "sse-starlette==3.4.6",
    "langchain==1.3.14",
    "langgraph==1.2.9",
    "langgraph-checkpoint-postgres==3.1.0",
    "langchain-openai==1.4.1",
    "sqlalchemy[asyncio]==2.0.51",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]